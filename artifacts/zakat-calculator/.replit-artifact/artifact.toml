kind = "web"
previewPath = "/"
title = "Zakat Calculator"
description = "A bilingual Arabic and English Zakat calculator for gold, silver, and cash. It supports RTL and LTR layouts, explains Nisab and calculation results, and remembers the selected language."
version = "1.0.0"
id = "artifacts/zakat-calculator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21995

[services.development]
run = "pnpm --filter @workspace/zakat-calculator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zakat-calculator", "run", "build" ]
serve = "static"
publicDir = "artifacts/zakat-calculator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21995"
BASE_PATH = "/"
